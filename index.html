<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia 3310 Snake Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="viewport-wrapper">
        <div class="phone-model">
            <!-- Top bezel/speaker -->
            <div class="speaker-grill">
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
            </div>

            <!-- Screen Area -->
            <div class="screen-bezel">
                <div class="lcd-screen" id="lcd-screen">
                    <div class="screen-content">
                        <!-- Score Display -->
                        <div class="ui-layer" id="ui-score-layer">
                            <span id="score-text">Score: 0</span>
                        </div>

                        <!-- Game Over Display -->
                        <div class="ui-layer overlay-hidden" id="ui-game-over-layer">
                            <div class="game-over-text">Game Over</div>
                            <div class="restart-prompt">Press ANY KEY</div>
                        </div>

                        <!-- Start/Pause Overlay -->
                        <div class="ui-layer" id="ui-start-layer">
                            <div class="start-text">SNAKE</div>
                            <div class="restart-prompt">Press ANY KEY</div>
                        </div>
                        <div class="ui-layer overlay-hidden" id="ui-pause-layer">
                            <div class="pause-text">PAUSED</div>
                        </div>

                        <!-- Game Canvas -->
                        <canvas id="game-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="nokia-brand">NOKIA</div>

            <!-- Navigation Keys (Soft keys & Arrows) -->
            <!-- The 3310 generally had a central Navi key, C (Clear) key, and Up/Down -->
            <div class="nav-keys">
                <button class="key soft-key" data-key="soft-left"></button>
                <button class="key nav-up-down" data-key="nav-up">▲</button>
                <button class="key nav-up-down" data-key="nav-down">▼</button>
                <button class="key soft-key" data-key="soft-right">C</button>
            </div>

            <!-- Numpad (1-9, *, 0, #) -->
            <div class="numpad">
                <button class="key num-key" data-key="1">1</button>
                <button class="key num-key" data-key="2">2<span class="sub">abc</span></button>
                <button class="key num-key" data-key="3">3<span class="sub">def</span></button>

                <button class="key num-key" data-key="4">4<span class="sub">ghi</span></button>
                <button class="key num-key" data-key="5">5<span class="sub">jkl</span></button>
                <button class="key num-key" data-key="6">6<span class="sub">mno</span></button>

                <button class="key num-key" data-key="7">7<span class="sub">pqrs</span></button>
                <button class="key num-key" data-key="8">8<span class="sub">tuv</span></button>
                <button class="key num-key" data-key="9">9<span class="sub">wxyz</span></button>

                <button class="key num-key symbol" data-key="*">*</button>
                <button class="key num-key" data-key="0">0</button>
                <button class="key num-key symbol" data-key="#">#</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
